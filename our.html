<style>

.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);display:grid;place-items:start center;padding:2rem 1rem;overflow:auto;z-index:80;animation:rise .25s both}@keyframes rise{from{opacity:0;transform:translateY(12px)}}

.hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}.hearts span{position:absolute;bottom:-40px;color:var(--a);opacity:0;animation:fl linear infinite}@keyframes fl{10%{opacity:.14}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.load{text-align:center;font-size:2rem;color:var(--a);animation:beat 1.2s infinite;padding:8rem 3rem}

.stage:before{content:'OUR ARCHIVES';position:absolute;font:400 clamp(6rem,24vw,24rem)/.8 'Bebas Neue',sans-serif;color:transparent;-webkit-text-stroke:1px var(--b);white-space:nowrap;pointer-events:none}
.stage .card{position:relative;width:min(100%,430px);padding:2.2rem;border:0;border-top:3px solid var(--a);transform:none}.stage .card:hover{transform:none;background:var(--s)}.stage label{margin-bottom:1rem}.stage .btn{width:100%}.stage .logo{justify-content:center;font-size:2.6rem}.tag{text-align:center;font-style:italic;font-size:.85rem;margin:.3rem 0 1.4rem}

<body>
<div class="hearts" id="hearts"></div><div id="toasts"></div>
<main id="auth" class="stage" hidden>
  <form class="card" id="af" autocomplete="off">
    <div class="logo"><i>♥</i> Our Archives</div><p class="tag">Every date has a story. Every memory has a place.</p>
    <div class="su"><label>Your name<input name="n1" maxlength="40"></label><label>Your partner's name<input name="n2" maxlength="40"></label><label>Relationship start date<input type="date" name="start"></label></div>
    <label>Passcode<div class="pw"><input type="password" name="pass" required minlength="4"><button type="button" id="sp">Show</button></div></label>
    <label class="su">Confirm passcode<input type="password" name="pass2"></label>
    <button class="btn" id="abtn">Enter</button><p class="tag" id="anote" style="margin:1rem 0 0"></p>
  </form>
</main>
<div id="app" hidden>
  <header class="top"><div class="logo"><i>♥</i><span>OUR ARCHIVES</span></div><nav class="nav" id="nav"></nav>
    <div class="tools"><small id="who"></small><button class="ib-btn" data-act="theme">Theme</button><button class="ib-btn" data-act="out">Lock</button><button class="btn" data-act="add">+ Memory</button></div></header>
  <main id="view"></main>
  <footer class="ft"><div class="logo"><i>♥</i> Our Archives</div><p>Everything is stored privately in this browser. The passcode only locks the screen on this device.</p></footer>
  <button class="fab" data-act="add"><i></i>Add memory</button>
</div>
<script>
// ===== helpers =====
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,fmt=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{dateStyle:'full'});
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const dd=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
const nextOf=(d,rec,t)=>{if(!rec)return d>=t?d:null;let n=t.slice(0,4)+d.slice(4);if(n<t)n=(+t.slice(0,4)+1)+d.slice(4);return n};
const U={},url=x=>U[x.id]??=URL.createObjectURL(x.blob);
const MOODS=['Happy','Romantic','Peaceful','Excited','Nostalgic','Grateful'],CATS=['General','Date','Trip','Food','Milestone','Celebration','Diary'];
const OKTYPE=/^(image\/(jpeg|png|webp|gif)|video\/(mp4|quicktime|webm))$/;
function toast(m,ok){const e=document.createElement('div');e.className='toast'+(ok?' ok':'');e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),4200)}
function modal(h,c=''){const m=document.createElement('div');m.className='modal '+c;m.innerHTML=`<div class="box">${c.includes('nox')?'':'<button class="mx" data-act="cl" aria-label="Close">✕</button>'}${h}</div>`;m.addEventListener('mousedown',e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}
function ask(msg){return new Promise(r=>{const m=modal(`<h2>Are you sure?</h2><p>${esc(msg)}</p><div class="actions"><button class="btn ghost" data-r="0">Cancel</button><button class="btn" data-r="1">Confirm</button></div>`,'nox');m.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b){m.remove();r(b.dataset.r==='1')}});m.addEventListener('mousedown',e=>{if(e.target===m)r(false)})})}
// ===== IndexedDB (data lives in this browser, survives refresh/close) =====
const DB=new Promise((ok,no)=>{const r=indexedDB.open('our-archives',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('memories',{keyPath:'id'});d.createObjectStore('dates',{keyPath:'id'});d.createObjectStore('meta')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(s,m,f)=>{const d=await DB;return new Promise((ok,no)=>{const t=d.transaction(s,m),r=f(t.objectStore(s));t.oncomplete=()=>ok(r&&r.result);t.onerror=t.onabort=()=>no(t.error||new Error('Storage error (is the disk or browser storage full?)'))})};
const all=s=>tx(s,'readonly',o=>o.getAll()),put=(s,v,k)=>tx(s,'readwrite',o=>o.put(v,k)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k)),get=(s,k)=>tx(s,'readonly',o=>o.get(k));
let cfg=null,M=[],D=[],view='home',cal=new Date(new Date().getFullYear(),new Date().getMonth(),1),vault={f:'all',q:'',l:'gridv'},vItems=[],LB=null;
const live=()=>M.filter(m=>!m.deletedAt).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0),liveD=()=>D.filter(x=>!x.deletedAt);
const byId=id=>M.find(m=>m.id===id);
async function load(){[M,D]=await Promise.all([all('memories'),all('dates')])}
async function purge(){const lim=Date.now()-30*864e5;for(const m of await all('memories'))if(m.deletedAt&&m.deletedAt<lim)await del('memories',m.id);for(const x of await all('dates'))if(x.deletedAt&&x.deletedAt<lim)await del('dates',x.id)}
// ===== theme, hearts =====
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('oa-theme',t)}catch{}}
setTheme((()=>{try{return localStorage.getItem('oa-theme')||'dark'}catch{return'dark'}})());
